<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Tema antes de pintar (sin parpadeo): eleccion guardada o tema del sistema.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("clonexa_theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <title>Clonexa</title>
    <!--app-head-->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0710" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf8fa" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Clonexa" />
    <meta property="og:image" content="https://www.clonexa.com.co/og-clonexa.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clonexa: si tu negocio lo hace, Clonexa lo conecta" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.clonexa.com.co/og-clonexa.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
