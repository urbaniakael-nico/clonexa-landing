<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Tema antes de pintar (sin parpadeo): eleccion guardada o tema del sistema.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("clonexa_theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <title>Clonexa | Sistema operativo para restaurantes, bares, talleres y equipos en campo</title>
    <meta

    />
